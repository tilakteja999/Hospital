{% extends 'base.html' %}

{% block title %}Reset Password | Hospital Government of India{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 30px auto;">
  <div class="vital-card" style="padding: 32px; border-top: 4px solid var(--accent-saffron);">
    
    <div style="text-align:center; margin-bottom: 24px;">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 153, 51, 0.15); color: #ff9933; display:inline-flex; align-items:center; justify-content:center; font-size: 1.6rem; margin-bottom: 10px;">
        🔑
      </div>
      <h2 style="color: var(--primary-navy); font-weight: 700; font-size: 1.4rem;">Reset Password</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Enter your registered mobile number and OTP to set a new password</p>
    </div>

    <form method="POST" action="{% url 'forgot_password' %}">
      {% csrf_token %}

      <!-- Phone Number -->
      <div class="form-group">
        <label class="form-label" for="phone">Registered Mobile Number</label>
        <div style="display:flex; align-items:center; position:relative;">
          <span style="position:absolute; left: 12px; font-weight: 600; color: var(--text-muted); font-size: 0.9rem;">+91</span>
          <input type="text" name="phone" id="phone" class="form-control" style="padding-left: 50px;" placeholder="9876543210" required>
        </div>
      </div>

      <!-- OTP -->
      <div class="form-group">
        <label class="form-label" for="otp">Enter Verification OTP (Demo OTP: 123456)</label>
        <input type="text" name="otp" id="otp" class="form-control" placeholder="123456" value="123456" required>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label class="form-label" for="new_password">New Password</label>
        <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Enter new password" required>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 6px; font-size: 1rem;">
        Update Password
      </button>

      <div style="text-align: center; margin-top: 18px; font-size: 0.88rem;">
        <a href="{% url 'patient_login' %}" style="color: var(--text-muted); text-decoration: none;">
          ← Back to Login
        </a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
