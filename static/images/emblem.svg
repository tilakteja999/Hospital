<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- National Emblem Shield & Medical Cross -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="tricolor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="46" fill="#0b2545" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#FF9933" stroke-width="1.5" stroke-dasharray="2,2"/>
  
  <!-- Central Medical Cross -->
  <rect x="42" y="22" width="16" height="56" rx="4" fill="#00A86B" />
  <rect x="22" y="42" width="56" height="16" rx="4" fill="#00A86B" />
  
  <!-- Center Emblem Shield -->
  <circle cx="50" cy="50" r="16" fill="#FFFFFF" stroke="#0b2545" stroke-width="2"/>
  
  <!-- Ashoka Chakra 24 spokes -->
  <circle cx="50" cy="50" r="12" fill="none" stroke="#000080" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="3" fill="#000080"/>
  <!-- Spokes -->
  <g stroke="#000080" stroke-width="0.8">
    <line x1="50" y1="38" x2="50" y2="62"/>
    <line x1="38" y1="50" x2="62" y2="50"/>
    <line x1="41.5" y1="41.5" x2="58.5" y2="58.5"/>
    <line x1="41.5" y1="58.5" x2="58.5" y2="41.5"/>
  </g>
  
  <!-- Government Star Ribbon -->
  <polygon points="50,6 53,15 62,15 55,20 57,29 50,23 43,29 45,20 38,15 47,15" fill="url(#goldGrad)"/>
</svg>
